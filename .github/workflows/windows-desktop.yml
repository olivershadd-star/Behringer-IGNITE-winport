name: Windows desktop build
on:
  workflow_dispatch:
  push:
    paths: ['Source/Application/**', 'build-windows.ps1', '.github/workflows/windows-desktop.yml']
  pull_request:
    paths: ['Source/Application/**', 'build-windows.ps1', '.github/workflows/windows-desktop.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile and package
        shell: pwsh
        run: ./build-windows.ps1
      - name: Test Windows sequencer clock
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --target IgniteClockTest
          if ($LASTEXITCODE -ne 0) { throw 'Clock test build failed' }
          ./Source/Application/Release/IgniteClockTest.exe
          if ($LASTEXITCODE -ne 0) { throw 'Clock test failed' }
      - name: Launch original desktop and test sequencer audio
        shell: pwsh
        run: |
          $app = Start-Process -FilePath ./dist/Ignite-Windows-x64/Ignite.exe -ArgumentList '--desktop-smoke' -WorkingDirectory $PWD -PassThru
          if (-not $app.WaitForExit(45000)) { Stop-Process -Id $app.Id -Force; throw 'Desktop startup timed out' }
          if ($app.ExitCode -ne 0) { throw "Desktop startup failed: $($app.ExitCode)" }
      - name: Test original instrument selection interface
        shell: pwsh
        run: |
          $app = Start-Process -FilePath ./dist/Ignite-Windows-x64/Ignite.exe -ArgumentList '--original-ui-test' -WorkingDirectory $PWD -PassThru
          if (-not $app.WaitForExit(45000)) { Stop-Process -Id $app.Id -Force; throw 'Original UI test timed out' }
          if ($app.ExitCode -ne 0) { throw "Original UI test failed: $($app.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Desktop-screenshot
          path: |
            desktop-smoke.png
            desktop-sequence-test.txt
            original-ui-test.txt
            original-ui-presets.png
            original-ui-final.png
            original-ui-progress.txt
            original-ui-before-click.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Ignite-Windows-x64
          path: dist/Ignite-Windows-x64/*
          if-no-files-found: error
